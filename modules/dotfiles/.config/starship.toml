"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$fill\
$all\
$line_break\
$character"""

[character]
error_symbol = "[✗](bold blue)"
success_symbol = "[❯](bold blue)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold blue"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic blue"

[git_status]
format     = '[$all_status]($style)'
style      = "blue"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
