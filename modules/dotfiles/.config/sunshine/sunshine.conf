capture = kwin
encoder = vaapi
gamepad = switch

# capture the dummy plug directly, so the physical monitor can stay on
output_name = DP-3

# AMD VAAPI overshoots the frame budget on scene changes, which Moonlight reports as a slow connection
vaapi_strict_rc_buffer = enabled

# TVs advertise AV1 but decode it poorly; HEVC is the reliable path here
av1_mode = 1

# temporary: diagnosing black screen on the TV clients
min_log_level = debug
