config_version = 2

[plugins]
enabled = ["noctalia/screen_recorder"]
auto_update = "all"

[location]
auto_locate = false
address = "Campina Grande - Paraíba, Brasil"

[bar.default]
background_opacity = 0.75
end = [
  "cpu",
  "ram",
  "temp",
  "spacer_2",
  "tray",
  "notifications",
  "clipboard",
  "bluetooth",
  "volume",
  "control-center",
  "session",
]
font_family = "JetBrainsMono NF"
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
start = ["workspaces"]

[dock]
auto_hide = true
background_opacity = 1
enabled = true
pinned = [
  "org.gnome.Nautilus",
  "com.mitchellh.ghostty",
  "brave-origin",
  "steam",
]
reserve_space = false
show_dots = true
show_instance_count = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 1321.0
output = "DP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true

[shell]
font_family = "JetBrainsMono NF"
lang = "en"

[theme]
builtin = "Ayu"
source = "custom"
custom_palette = "matte-black"
wallpaper_scheme = "m3-rainbow"

[theme.templates]
builtin_ids = ["btop", "foot", "gtk3", "gtk4", "ghostty", "qt"]
community_ids = ["obsidian", "opencode", "papirus-icons", "pi-agent", "yazi"]

[wallpaper]
directory = "/home/henrique/.dotfiles/assets"

[wallpaper.default]
path = "/home/henrique/.dotfiles/assets/wallpaper.png"

[wallpaper.last]
path = "/home/henrique/.dotfiles/assets/wallpaper.png"

[widget.clock]
format = "{:%H:%M %a %d/%m}"

[widget.date]
format = "{:%a %d/%m}"

[widget.media]
title_scroll = "always"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.sysmon]
stat = "ram_used"

[widget.tray]
drawer = true

[widget.workspaces]
active_pill_size = 1.0
capsule_radius = 2
empty_color = "shadow"
occupied_color = "outline"
