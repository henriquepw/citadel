# Config do umbriel. Espelha 1:1 a do niri (~/.config/niri/config.kdl) e a do
# mango (~/.config/mango/config.conf) — mesmos autostarts, regras de janela e
# atalhos; só muda a sintaxe e o que cada compositor suporta.

[include]
files = []

[include.optional]
files = ["noctalia.toml"]

[general]
autostart = [
  "fcitx5",
  "noctalia",
  "hushmic --tray",
  "ghostty -e tmux new-session -A -s main",
  "brave-origin --app-id=cinhimbnkkaeohfgghhklpknlkffjgod", # youtube music
  "brave-origin --app-id=bihdiinlknbhociakahmdjfokjkobgmp", # sable
  "brave-origin --app-id=hnpfjngllnobngcgfapefoaidbinmjnm", # whatsapp
  "steam",
]
mod_key = "Super"
xwayland = true
show_cheatsheet = false
focus_on_activate = false

[environment]
ELECTRON_OZONE_PLATFORM_HINT = "auto"
SDL_VIDEODRIVER = "wayland"

[input]
middle_click_paste = true

[input.keyboard]
layout = "us"
variant = "intl"
repeat_rate = 25
repeat_delay = 400
numlock_toggle = false
track_layout = "global"

[input.mouse]
accel_profile = "flat"
sensitivity = 0.35

[appearance]
prefer_no_csd = true
border_width = 1
corner_radius = 6

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = false

[layout]
mode = "dwindle"
gap = 4

[layout.scrolling]
default_extent_fraction = 0.6
center_underfull_strip = true
center_focused = "never"

[layout.master]
position = "left"
new_on_top = false
new_becomes_master = false
default_width_fraction = 0.6

[output.DP-1]
workspaces = 6
workspace_axis = "vertical"

# TV no HDMI: fica fora da área de trabalho até o Mod+Alt+H ligar
[output."HDMI-A-1"]
enabled = false

[[workspace]]
index = 1
layout.mode = "master"

[[workspace]]
index = 5
layout.mode = "scrolling"

[[scratchpad]]
name = "music"

[[layer_rule]]
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
match.namespace = "^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd)$"

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^com\\.mitchellh\\.ghostty$"
default_workspace = 1

[[window_rule]]
match.app_id = "^brave-.*-Default$"
match.title = "^(WhatsApp|Sable).*$"
default_workspace = 4

[[window_rule]]
match.app_id = "^brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default$"
default_scratchpad = "music"
default_floating = true
default_focused = false
default_position = { x = 0, y = 40, anchor = "top" }
default_floating_size_px = { width = 1225, height = 936 }

[[window_rule]]
match.app_id = "^steam$"
default_workspace = 5

[keybinds]

"Mod+Return" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"

"Mod+Shift+T" = "spawn:ghostty -e tmux new-session -A -s main"
"Mod+Shift+Alt+T" = "spawn:ghostty"
"Mod+Shift+F" = "spawn:nautilus"
"Mod+Shift+B" = "spawn:brave-origin"
"Mod+Shift+Alt+B" = "spawn:brave-origin --private"
"Mod+Shift+S" = "spawn:steam"
"Mod+Shift+M" = "scratchpad-toggle:music"
"Mod+Shift+D" = "spawn:focus-or-launch ^brave-bihdiinlknbhociakahmdjfokjkobgmp-Default$ brave-origin --app-id=bihdiinlknbhociakahmdjfokjkobgmp" # Sable
"Mod+Shift+G" = "spawn:focus-or-launch ^brave-hnpfjngllnobngcgfapefoaidbinmjnm-Default$ brave-origin --app-id=hnpfjngllnobngcgfapefoaidbinmjnm" # WhatsApp

"Mod+Alt+H" = "output-toggle:HDMI-A-1"

"Mod+N" = "window-toggle-floating"
"Mod+Shift+W" = "window-close"
"Mod+Backspace" = "window-toggle-maximize"
"Mod+M" = "window-toggle-maximize"
"Mod+Ctrl+M" = "window-toggle-fullscreen"
"Mod+O" = "overview-toggle"

"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

"Mod+Left" = "column-move-left"
"Mod+Down" = "window-move-down"
"Mod+Up" = "window-move-up"
"Mod+Right" = "column-move-right"

"Mod+Ctrl+H" = "window-move-or-output-left"
"Mod+Ctrl+J" = "window-move-or-output-down"
"Mod+Ctrl+K" = "window-move-or-output-up"
"Mod+Ctrl+L" = "window-move-or-output-right"

"Mod+P" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+P" = "spawn:noctalia msg annotate"

"Mod+1" = "window-move-to-workspace:1"
"Mod+2" = "window-move-to-workspace:2"
"Mod+3" = "window-move-to-workspace:3"
"Mod+4" = "window-move-to-workspace:4"
"Mod+5" = "window-move-to-workspace:5"
"Mod+6" = "window-move-to-workspace:6"
"Mod+Q" = "workspace-switch:1"
"Mod+W" = "workspace-switch:2"
"Mod+E" = "workspace-switch:3"
"Mod+R" = "workspace-switch:4"
"Mod+T" = "workspace-switch:5"
"Mod+Y" = "workspace-switch:6"

"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
