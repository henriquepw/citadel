# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - https://raw.githubusercontent.com/terrapkg/packages/f%OS_VERSION%/anda/terra/release/terra.repo
      keys:
        - https://repos.fyralabs.com/terra%OS_VERSION%/key.asc
    install:
      packages:
        - mangowm
        - xorg-x11-server-Xwayland
        - google-noto-emoji-fonts
        - jetbrains-mono-fonts
        - papirus-icon-theme
        - breeze-cursor-theme
        - noctalia

  - type: dnf
    repos:
      copr:
        - fnux/ly
        - alternateved/keyd
    install:
      packages:
        # display manager (base-main não vem com nenhum)
        - ly

        # remapeamento de teclado (meta+c/v/x/a/z -> clipboard)
        - keyd

        # portal xdg para telas wlroots (screen share do Sunshine, etc.)
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk

        # IME wayland-native, para compose sequences (~/.XCompose) em apps ozone/wayland
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
