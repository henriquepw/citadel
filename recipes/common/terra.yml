# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: script
    snippets:
      # O terra.repo usa repo_gpgcheck=1 apontando pra
      # file:///etc/pki/rpm-gpg/RPM-GPG-KEY-terra$releasever, mas o `keys:` do
      # módulo dnf só faz `rpm --import <url>` e não grava esse arquivo. Sem
      # ele o repo carrega só o repomd e todo pacote do Terra vira
      # "No match for argument". Gravamos a chave aqui, antes de qualquer
      # módulo dnf que use o Terra.
      - |
        set -euo pipefail
        ver="$(rpm -E %fedora)"
        curl -fsSL -o "/etc/pki/rpm-gpg/RPM-GPG-KEY-terra${ver}" \
          "https://repos.fyralabs.com/terra${ver}/key.asc"
