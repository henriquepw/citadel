# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - wlroots
        - scenefx
        - xdg-desktop-portal-wlr
        - mango

  # ensure the display manager sees the session if the package lacks a .desktop
  - type: script
    snippets:
      - |
        set -euo pipefail

        # start the desktop shell with Mango, else only the empty background shows
        # wait for chezmoi's first apply so noctalia reads the dotfiles config, not its first-run defaults
        noctalia_exec="exec-once=sh -c 'systemctl --user start chezmoi-init.service; exec noctalia --daemon'"
        if [ -f /etc/mango/config.conf ] && ! grep -qxF "$noctalia_exec" /etc/mango/config.conf; then
          printf '\n%s\n' "$noctalia_exec" >> /etc/mango/config.conf
        fi

        # default cursor theme for X11/XWayland apps; written here because libXcursor
        printf '[Icon Theme]\nInherits=Bibata-Modern-Ice\n' > /usr/share/icons/default/index.theme

        if [ ! -f /usr/share/wayland-sessions/mango.desktop ]; then
          mkdir -p /usr/share/wayland-sessions
          cat > /usr/share/wayland-sessions/mango.desktop <<'DESKTOP'
        [Desktop Entry]
        Name=Mango
        Comment=A wayland compositor based on wlroots and scenefx
        Exec=/usr/bin/mango
        Type=Application
        DesktopNames=mango;wlroots
        DESKTOP
        fi
