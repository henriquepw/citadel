# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - wlroots
        - scenefx
        - xdg-desktop-portal-wlr
        - mango

  # garante que o display manager enxergue a sessão, caso o pacote não instale o .desktop
  - type: script
    snippets:
      - |
        set -euo pipefail
        if [ ! -f /usr/share/wayland-sessions/mango.desktop ]; then
          mkdir -p /usr/share/wayland-sessions
          cat > /usr/share/wayland-sessions/mango.desktop <<'DESKTOP'
        [Desktop Entry]
        Name=Mango
        Comment=A wayland compositor based on wlroots and scenefx
        Exec=mango
        Type=Application
        DesktopNames=mango;wlroots
        DESKTOP
        fi
