# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - firewalld

  - type: systemd
    system:
      enabled:
        - ly.service
        - keyd.service
    user:
      enabled:
        - syncthing.service

  - type: script
    snippets:
      # base-main não tem DE nenhum, então o boot-target default é multi-user; sem isso o ly nunca sobe
      - systemctl set-default graphical.target

      # timezone (base-main não define nenhuma)
      - systemd-firstboot --force --timezone=America/Sao_Paulo

      # firewall: syncthing (sync + descoberta local + gui)
      - firewall-offline-cmd --add-port=22000/tcp
      - firewall-offline-cmd --add-port=22000/udp
      - firewall-offline-cmd --add-port=21027/udp
      - firewall-offline-cmd --add-port=8384/tcp
