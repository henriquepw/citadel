# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - alternateved/keyd
        - fovty/hushmic
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        # display
        - ly
        - xorg-x11-server-Xwayland
        - xdg-desktop-portal-gtk
        - gnome-keyring-pam

        # desktop
        - noctalia
        - nextcloud-client
        - nextcloud-client-nautilus

        # themes
        - papirus-icon-theme
        - bibata-cursor-theme
        - adw-gtk3-theme
        - terminus-fonts-console

        # input
        - keyd
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - wl-clipboard

        # audio
        - hushmic

        # browsers
        - brave-origin

        # network
        - firewalld

  # apps
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nautilus
        - glycin-thumbnailer
        - sushi
        - loupe

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  # GTK settings (used via xdg-desktop-portal)
  - type: gschema-overrides
    include:
      - zz1-citadel-fonts.gschema.override
      - zz1-citadel-cursor.gschema.override
      - zz1-citadel-theme.gschema.override

  - type: default-flatpaks
    configurations:
      - scope: user
        install:
          - com.bambulab.BambuStudio
          - org.freecad.FreeCAD
          - io.gitlab.librewolf-community
          - org.keepassxc.KeePassXC
          - moe.sable.client
          - org.gnome.Boxes
          - org.onlyoffice.desktopeditors

  - type: systemd
    system:
      enabled:
        - keyd.service
        - ly@tty2.service

  - type: script
    snippets:
      # zapfast: rpm from the latest github release
      - >-
        dnf install -y $(curl -fsSL https://api.github.com/repos/crmne/zapfast/releases/latest
        | grep -oP '"browser_download_url":\s*"\K[^"]+\.x86_64\.rpm')
