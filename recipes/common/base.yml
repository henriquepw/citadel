# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      copr:
        - alternateved/keyd
        - fovty/hushmic
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        # display
        - ly
        - xorg-x11-server-Xwayland
        - xdg-desktop-portal-gtk

        # desktop
        - noctalia

        # themes
        - papirus-icon-theme
        - bibata-cursor-theme

        # input
        - keyd
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - wl-clipboard

        # audio
        - hushmic

        # browsers
        - brave-origin

        # network
        - firewalld

  # apps
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - syncthing
        - nautilus

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  # GTK font settings (used via xdg-desktop-portal)
  - type: gschema-overrides
    include:
      - zz1-citadel-fonts.gschema.override

  - type: default-flatpaks
    configurations:
      - install:
          - com.bambulab.BambuStudio
          - org.freecad.FreeCAD
          - io.gitlab.librewolf-community
      - repo:
          name: sable-nightly
          title: Sable Nightly
          url: https://sableclient.github.io/Sable/sable-nightly.flatpakrepo
        install:
          - moe.sable.client.Nightly

  - type: systemd
    system:
      enabled:
        - keyd.service
        - ly@tty2.service
    user:
      enabled:
        - syncthing.service

  - type: script
    snippets:
      # zapfast: rpm from the latest github release
      - >-
        dnf install -y $(curl -fsSL https://api.github.com/repos/crmne/zapfast/releases/latest
        | grep -oP '"browser_download_url":\s*"\K[^"]+\.x86_64\.rpm')

      # firewall: syncthing
      - firewall-offline-cmd --add-port=22000/tcp
      - firewall-offline-cmd --add-port=22000/udp
      - firewall-offline-cmd --add-port=21027/udp
      - firewall-offline-cmd --add-port=8384/tcp
