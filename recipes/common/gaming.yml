# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        - steam
        - steam-devices
        - antimicrox
        - gamescope
        - mangohud
        - gamemode
        - mesa-dri-drivers
        - mesa-vulkan-drivers

  - type: dnf
    repos:
      copr:
        - lizardbyte/stable
    install:
      packages:
        - Sunshine

  - type: default-flatpaks
    configurations:
      - scope: user
        install:
          - com.vysp3r.ProtonPlus
          - com.heroicgameslauncher.hgl
          - io.github.benjamimgois.goverlay

  - type: systemd
    user:
      enabled:
        - app-dev.lizardbyte.app.Sunshine.service
        - citadel-millennium.service

  - type: script
    snippets:
      # millennium (steambrew): tarball from the latest github release, files live in /usr/lib/millennium
      - |
        set -euo pipefail
        tag=$(curl -fsSL https://api.github.com/repos/SteamClientHomebrew/Millennium/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
        base="https://github.com/SteamClientHomebrew/Millennium/releases/download/${tag}/millennium-${tag}-linux-x86_64"
        tmp=$(mktemp -d)
        curl -fsSL -o "${tmp}/millennium-${tag}-linux-x86_64.tar.gz" "${base}.tar.gz"
        (cd "${tmp}" && curl -fsSL "${base}.sha256" | sha256sum -c --status)
        tar xzf "${tmp}/millennium-${tag}-linux-x86_64.tar.gz" -C /
        chmod +x /usr/lib/millennium/libmillennium_pvs64 /usr/lib/millennium/libmillennium_luavm_x86
        rm -rf "${tmp}"

      - firewall-offline-cmd --add-port=47984-47990/tcp
      - firewall-offline-cmd --add-port=48010/tcp
      - firewall-offline-cmd --add-port=47998-48000/udp
      - firewall-offline-cmd --add-port=48002/udp
