# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        - steam
        - steam-devices
        - antimicrox
        - gamescope
        - mangohud
        - gamemode

  - type: dnf
    repos:
      copr:
        - lizardbyte/stable
    install:
      packages:
        - Sunshine

  - type: default-flatpaks
    configurations:
      - scope: user
        install:
          - com.vysp3r.ProtonPlus
          - com.heroicgameslauncher.hgl
          - io.github.benjamimgois.goverlay

  - type: systemd
    system:
      enabled:
        - decky-loader@henrique.service
    user:
      enabled:
        - app-dev.lizardbyte.app.Sunshine.service
        - citadel-decky.service

  - type: script
    snippets:
      # decky loader: binário da última release do github, os plugins ficam em ~/homebrew
      - |
        set -euo pipefail
        install -d /usr/libexec/decky
        curl -fsSL -o /usr/libexec/decky/PluginLoader https://github.com/SteamDeckHomebrew/decky-loader/releases/latest/download/PluginLoader
        chmod +x /usr/libexec/decky/PluginLoader

      - firewall-offline-cmd --add-port=47984-47990/tcp
      - firewall-offline-cmd --add-port=48010/tcp
      - firewall-offline-cmd --add-port=47998-48000/udp
      - firewall-offline-cmd --add-port=48002/udp
