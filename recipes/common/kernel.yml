# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# swaps the stock kernel for Bazzite's "ogc" kernel, same as ghcr.io/ublue-os/bazzite
modules:
  - type: copy
    from: ghcr.io/ublue-os/akmods:ogc-44
    src: /kernel-rpms/
    dest: /tmp/kernel-rpms

  - type: script
    snippets:
      - |
        set -euo pipefail

        pushd /usr/lib/kernel/install.d
        mv 05-rpmostree.install 05-rpmostree.install.bak
        mv 50-dracut.install 50-dracut.install.bak
        printf '%s\n' '#!/bin/sh' 'exit 0' > 05-rpmostree.install
        printf '%s\n' '#!/bin/sh' 'exit 0' > 50-dracut.install
        chmod +x 05-rpmostree.install 50-dracut.install
        popd

        for pkg in kernel kernel{-core,-modules,-modules-core,-modules-extra,-tools-libs,-tools}; do
          rpm --erase "${pkg}" --nodeps || true
        done
        rm -rf /usr/lib/modules

        dnf5 -y install \
          /tmp/kernel-rpms/kernel-[0-9]*.rpm \
          /tmp/kernel-rpms/kernel-core-*.rpm \
          /tmp/kernel-rpms/kernel-modules-*.rpm

        dnf5 versionlock add kernel kernel-core kernel-modules

        pushd /usr/lib/kernel/install.d
        mv -f 05-rpmostree.install.bak 05-rpmostree.install
        mv -f 50-dracut.install.bak 50-dracut.install
        popd

        # os hooks do dracut ficaram desativados na instalação, então o
        # initramfs precisa ser gerado na mão (sem ele o boot dá kernel panic)
        kver="$(rpm -q kernel-core --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}')"
        depmod -a "$kver"
        DRACUT_NO_XATTR=1 dracut --no-hostonly --kver "$kver" --reproducible --add ostree -f "/usr/lib/modules/$kver/initramfs.img"
        chmod 0600 "/usr/lib/modules/$kver/initramfs.img"

        rm -rf /tmp/kernel-rpms
