# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Bazzite's ogc kernel + kmods + initramfs; must be the last module before signing
modules:
  - type: kargs
    kargs:
      - quiet
      - loglevel=3
      - rd.udev.log_level=3
      - udev.log_priority=3

  - type: copy
    from: ghcr.io/ublue-os/akmods:ogc-44
    src: /kernel-rpms/
    dest: /tmp/kernel-rpms

  - type: script
    scripts:
      - install-kernel.sh

  - type: akmods
    base: ogc
    install:
      - v4l2loopback
      - xone
      - xpadneo

  - type: script
    scripts:
      - build-initramfs.sh
