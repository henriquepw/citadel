# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Bazzite's ogc kernel + kmods + initramfs; must be the last module before signing
modules:
  - type: kargs
    kargs:
      - quiet
      - loglevel=3
      - rd.udev.log_level=3
      - udev.log_priority=3
      # enable HDMI 2.1 FRL (0x400) on top of the default 0x2; off upstream until Linux 7.4
      - amdgpu.dcfeaturemask=0x402

  - type: copy
    from: ghcr.io/ublue-os/akmods:ogc-44
    src: /kernel-rpms/
    dest: /tmp/kernel-rpms

  - type: copy
    from: ghcr.io/ublue-os/akmods:ogc-44
    src: /rpms/
    dest: /tmp/akmods-rpms

  - type: script
    scripts:
      - install-kernel.sh

  - type: script
    scripts:
      - build-initramfs.sh
