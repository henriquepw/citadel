# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - arcticlore/candy
    install:
      packages:
        - nodejs
        - golang
        - rust
        - cargo
        - zig
        - watchexec
        - boxes
        - android-tools
        - git
        - gh
        - lazygit
        - neovim
        - gcc
        - shellcheck
        - shfmt
        - rust-analyzer
        - clang-tools-extra
        - tree-sitter

  - type: script
    snippets:
      - npm install -g bun @anthropic-ai/claude-code @openai/codex

  - type: lsp
    source: local

  - type: systemd
    system:
      enabled:
        - sshd.service

  - type: script
    snippets:
      - firewall-offline-cmd --add-service=ssh

  - type: default-flatpaks
    configurations:
      - install:
          - com.google.AndroidStudio

