# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - arcticlore/candy
        - scottames/ghostty
        - atim/starship
    install:
      packages:
        # terminal
        - ghostty
        - zsh
        - tmux
        - starship

        # utils
        - make
        - stow
        - ripgrep
        - fd-find
        - jq
        - tree
        - unzip
        - zoxide
        - bat
        - btop
        - fzf
        - watchexec
        - fastfetch

        # graphics
        - chafa
        - libsixel

        # git
        - git
        - gh
        - lazygit
        - git-delta

        # editor
        - neovim
        - vis
        - tree-sitter

        # langs (see /usr/share/citadel/Brewfile)
        - nodejs
        - gcc
        - python3
        - lua

        # tooling
        - shellcheck
        - shfmt
        - android-tools


  - type: default-flatpaks
    configurations:
      - install:
          - com.google.AndroidStudio

  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-update: true
    auto-upgrade: true
    upgrade-wait-after-boot: 10m

  - type: systemd
    system:
      enabled:
        - sshd.service
    user:
      enabled:
        - citadel-brew-bundle.service

  - type: script
    snippets:
      - firewall-offline-cmd --add-service=ssh

      # zsh as the default shell for new users
      - sed -i 's|^SHELL=.*|SHELL=/usr/bin/zsh|' /etc/default/useradd



