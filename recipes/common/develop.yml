# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - arcticlore/candy
        - atim/starship
    install:
      packages:
        # terminal
        - ghostty
        - zsh
        - tmux
        - starship

        # utils
        - make
        - stow
        - ripgrep
        - fd-find
        - jq
        - tree
        - unzip
        - zoxide
        - bat
        - btop
        - fzf
        - watchexec
        - fastfetch

        # graphics
        - chafa
        - libsixel

        # git
        - git
        - gh
        - lazygit
        - git-delta

        # editor
        - neovim
        - vis
        - tree-sitter

        # langs (see /usr/share/citadel/Brewfile)
        - nodejs
        - gcc
        - python3
        - lua

        # tooling
        - shellcheck
        - android-tools


  - type: default-flatpaks
    configurations:
      - scope: user
        install:
          - com.google.AndroidStudio
          - com.usebruno.Bruno
          - com.mongodb.Compass
          - io.dbeaver.DBeaverCommunity


  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-update: true
    auto-upgrade: true
    upgrade-wait-after-boot: 10m

  - type: systemd
    system:
      enabled:
        - sshd.service
    user:
      enabled:
        - citadel-brew-bundle.service
        - podman.socket

  - type: script
    snippets:
      - firewall-offline-cmd --add-service=ssh

      # pyatv: fora do fedora e do brew, venv isolado com os CLIs em /usr/bin
      - |
        set -euo pipefail
        python3 -m venv /usr/libexec/pyatv
        # srptools 2.0 tornou `private` keyword-only e quebra o pareamento do pyatv
        /usr/libexec/pyatv/bin/pip install --no-cache-dir pyatv 'srptools<2'
        # python >= 3.14: get_event_loop() não cria mais o loop, e os CLIs do pyatv dependem disso
        for bin in atvremote atvscript atvlog atvproxy; do
          cat > /usr/bin/$bin <<EOF
        #!/usr/libexec/pyatv/bin/python3
        import asyncio, sys
        asyncio.set_event_loop(asyncio.new_event_loop())
        from pyatv.scripts.$bin import main
        sys.exit(main())
        EOF
          chmod 755 /usr/bin/$bin
        done

      # zsh as the default shell for new users
      - sed -i 's|^SHELL=.*|SHELL=/usr/bin/zsh|' /etc/default/useradd
