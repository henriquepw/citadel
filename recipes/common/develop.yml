# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      copr:
        - arcticlore/candy
    install:
      packages:
        - nodejs
        - golang
        - rust
        - cargo
        - zig
        - watchexec
        - boxes
        - android-tools
        - git
        - gh
        - lazygit
        - neovim
        - gcc
        - shellcheck
        - shfmt
        - rust-analyzer
        - clang-tools-extra
        - tree-sitter

  - type: script
    snippets:
      - npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai bun

  - type: lsp
    source: local
